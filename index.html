<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tatva Titans · Player Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#e9f0f7;--card:#fff;--side:#fff;--tx:#0b1424;--mu:#5b6b80;--bd:#d6e0ec;--ac:#078bdc;--gold:#b8860b;--ink:#fff;--hot:#078bdc;--soft:#eef4fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111e;--card:#121c2e;--side:#0e1626;--tx:#e8eef7;--mu:#8696ad;--bd:#1f2d45;--gold:#e6b840;--soft:#0e1829;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a111e;--card:#121c2e;--side:#0e1626;--tx:#e8eef7;--mu:#8696ad;--bd:#1f2d45;--gold:#e6b840;--soft:#0e1829;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.rt,.cnt,.btn,nav span,.big,.top b,.top em,.st b,.kp b,.n{font-family:Rajdhani,"Segoe UI",Arial,sans-serif}
.app{display:grid;grid-template-columns:84px 1fr;min-height:100vh}
nav{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;position:sticky;top:0;height:100vh}
nav .lg{width:52px;margin-bottom:14px}
nav button{width:100%;border:0;background:none;color:var(--mu);border-radius:14px;padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px}
nav button span{font-size:13px;font-weight:600;letter-spacing:.02em}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 6px 18px #078bdc55}
.main{padding:18px 22px 40px;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h1{margin:0;font-size:32px;font-weight:700}
.kp{display:flex;gap:8px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:5px 14px;text-align:center;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.kp b{display:block;font-size:22px;color:var(--ac);line-height:1.1;letter-spacing:0}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;border-radius:20px;padding:20px 24px;color:#fff;background:radial-gradient(circle at 85% 20%,#2fb1ff 0,transparent 45%),linear-gradient(110deg,#078bdc,#0a5aa6 60%,#08336e);margin-bottom:14px;box-shadow:0 12px 30px #078bdc33}
.hero img{width:86px;filter:drop-shadow(0 6px 10px #0006)}
.hero h2{margin:0;font-size:38px;font-weight:600;line-height:1;opacity:.95}.hero small{font-size:14px;opacity:.9}
.hs{display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px}.hs b{display:block;font:700 24px Rajdhani,sans-serif;line-height:1}.hs span{font-size:11px;opacity:.8}
.dash{display:grid;grid-template-columns:1fr 270px;gap:14px;align-items:start}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.pt{font:600 17px Rajdhani,sans-serif;border-left:4px solid var(--gold);padding-left:10px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.pt small{font:500 12px Inter,sans-serif;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .pn{margin:0}
.chip{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--soft);margin-bottom:6px;font-size:13px}.chip b{color:var(--ac)}
.roster{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;position:sticky;top:12px}
#rl{max-height:calc(100vh - 160px);overflow:auto}
.ro{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}.ro:hover{background:var(--soft)}.ro.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--ac)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#078bdc,#08336e);color:#fff;display:grid;place-items:center;font:700 14px Rajdhani,sans-serif;flex:none}
.ro b{display:block;font-size:13.5px;line-height:1.2}.ro small{color:var(--mu);font-size:11px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.ch{display:flex;gap:10px;align-items:center;margin-bottom:12px}.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft);border:1px solid var(--bd)}
.ch h3{margin:0;font-size:20px;line-height:1.05;border-left:4px solid var(--gold);padding-left:8px}.ch small{color:var(--mu);font-size:12px;padding-left:8px;display:block}
.top{background:linear-gradient(110deg,#078bdc,#08336e);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:22px;font-weight:700}.top em{font-size:26px;font-style:normal;font-weight:700;color:#ffe08a}.top small{display:block;opacity:.75;font-size:11px;letter-spacing:.1em}
.r{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 2px;cursor:pointer;border-bottom:1px dashed var(--bd)}.r:last-child{border:0}
.n{font-size:17px;font-weight:700;color:var(--mu)}.v{font-weight:600;font-size:13px;color:var(--ac)}
input[type=text],input[type=password]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:inherit;margin-bottom:10px}
.rt{font-size:46px;font-weight:700;line-height:.9;color:var(--ac)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--bd);margin:3px 3px 0 0}.tag.b{background:var(--ac);border-color:var(--ac);color:#fff}
.sq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.sq.in{border-color:var(--ac);background:linear-gradient(90deg,#078bdc22,transparent)}.sq small{color:var(--mu)}
.pill{padding:4px 14px;border-radius:99px;font-weight:700;font-size:12px;background:var(--bd)}.in .pill{background:var(--ac);color:#fff}
.cnt{font-size:34px;font-weight:700}.cnt span{color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 22px;font-size:18px;font-weight:700;cursor:pointer}.btn.o{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.drop{display:block;border:2px dashed var(--ac);border-radius:18px;padding:34px 16px;text-align:center;cursor:pointer;margin:12px 0;background:var(--soft)}.drop b{font:700 26px Rajdhani,sans-serif;display:block}
.lock{max-width:380px;margin:30px auto;text-align:center}.err{color:#e5484d;font-weight:600;min-height:20px}
.mr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;display:none;z-index:20;max-width:90%;text-align:center}
.note{color:var(--mu);font-size:12.5px;margin-top:14px}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--tx)}
@media(max-width:900px){.dash{grid-template-columns:1fr}.roster{order:-1;position:static}#rl{max-height:200px}.two{grid-template-columns:1fr}.hero{grid-template-columns:auto 1fr}.hs{grid-column:1/3}}
@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:14px 12px 100px}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:10;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd);gap:2px}
nav .lg{display:none}nav button{padding:6px 0;font-size:18px;border-radius:12px}nav button span{font-size:11px}.g{grid-template-columns:1fr}.kp div{padding:4px 9px}.hero img{width:60px}.hero h2{font-size:30px}}
.ft{margin-top:26px;padding:16px 0 0;border-top:1px solid var(--bd);text-align:center;color:var(--mu);font-size:13px}.ft b{color:var(--tx)}.ft span{color:var(--ac);font-weight:600}
.bar select{padding:8px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px Inter,sans-serif;margin-left:auto}
</style></head><body><div class="app"><nav id="nav"><img class="lg" alt="Tatva Titans">
<button data-t="lead" class="on"><i>🏆</i><span>Leaders</span></button><button data-t="pl"><i>👤</i><span>Players</span></button><button data-t="sq"><i>✅</i><span>Squad 15</span></button><button data-t="mt"><i>📋</i><span>Matches</span></button><button data-t="up"><i>🔒</i><span>Upload</span></button></nav>
<div class="main"><div class="bar"><h1 id="ttl">Leaderboards</h1><select id="tf" onchange="setTF(this.value)" title="Team filter"></select><div class="kp" id="kp"></div></div><main id="main"></main>
<p class="note">Strike rotation = (runs − boundary runs) ÷ (balls faced − 4s − 6s). The scorecard doesn’t list singles, so this is an estimate.</p><footer class="ft">© <span id="yr">2026</span> <span>Tatva Titans Analytics</span> · All rights reserved by <b>Ankit Vora</b></footer></div></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const HASH="7a19ed377df87c3fe90bce639be73342a6e963ff918ea614256961e696402c22";
const SEED=[];
const EXTRA=[];
const $=s=>document.querySelector(s);let P,L,CATS,ALL=[],repo=[],remote=[],local=[],db=null,tab="lead",sel=new Set(),touched=false,unlocked=false;
try{local=JSON.parse(localStorage.getItem("tt_local")||"[]");unlocked=sessionStorage.getItem("tt_ok")==="1"}catch(e){}
const balls=o=>{const[a,b="0"]=String(o).split(".");return +a*6+ +b};
const MY_TEAM="Titans",MY_RE=/^(tatva\s+)?titans(\s*[-–]?\s*[ab])?$/i;let SEL="";try{SEL=localStorage.getItem("tt_team")||""}catch(e){}
const inc=t=>SEL==="*"||(SEL===""?MY_RE.test(String(t).trim()):t===SEL);
function sides(m){const tn=[...new Set(m.innings.map(i=>i.team))],bat=[],bowl=[],field=[];m.innings.forEach(i=>{const ft=tn.find(t=>t!==i.team)||"";if(inc(i.team))bat.push(...i.bat);if(inc(ft)){bowl.push(...i.bowl);i.bat.forEach(x=>field.push(x[6]||""))}});return{bat,bowl,field}}
function fld(st){st=String(st||"").trim();let m;if(m=st.match(/^c\s*&\s*b\s+(.+)$/))return[{n:m[1].trim(),k:"ct"}];if(m=st.match(/^c\s+(.+?)\s+b\s+.+$/))return[{n:m[1].trim(),k:"ct"}];if(m=st.match(/^st\s+(.+?)\s+b\s+.+$/))return[{n:m[1].trim(),k:"stp"}];if(m=st.match(/^run out\s*\((.+?)\)?$/))return m[1].split("/").map(n=>({n:n.trim(),k:"ro"}));return[]}
function compute(){P={};const G=n=>P[n]||(P[n]={name:n,r:0,b:0,f:0,s:0,out:0,bl:0,rc:0,w:0,dots:0,ex:0,hs:0,m:0,bat:0,bow:0,ct:0,stp:0,ro:0});
ALL.forEach(m=>{const seen=new Set();[sides(m)].forEach(i=>{i.bat.forEach(x=>{const p=G(x[0]);p.r+=x[1];p.b+=x[2];p.f+=x[3];p.s+=x[4];p.out+=x[5];p.hs=Math.max(p.hs,x[1]);p.bat=1;seen.add(x[0])});i.bowl.forEach(x=>{const p=G(x[0]);p.bl+=balls(x[1]);p.rc+=x[2];p.w+=x[3];p.dots+=x[4];p.ex+=x[5]+x[6];p.bow=1;seen.add(x[0])});(i.field||[]).forEach(st=>fld(st).forEach(q=>{const p=G(q.n);p[q.k]++;seen.add(q.n)}))});seen.forEach(n=>G(n).m++)});
EXTRA.forEach(G);L=Object.values(P);
L.forEach(p=>{p.sr=p.b?p.r/p.b*100:0;p.bnd=p.f*4+p.s*6;p.rot=p.b-p.f-p.s>0?(p.r-p.bnd)/(p.b-p.f-p.s):0;p.eco=p.bl?p.rc/(p.bl/6):0;p.ov=Math.floor(p.bl/6)+(p.bl%6?"."+p.bl%6:"");p.fd=p.ct+p.stp+p.ro;p.imp=p.r+25*p.w+.3*p.dots-.5*p.ex+10*p.fd;p.role=p.bat&&p.bow?"All-rounder":p.bow?"Bowler":p.bat?"Batter":p.fd?"Fielder":"No data yet"});
CATS=[
{k:"Highest Run Scorer",i:"🔥",d:"Most total runs",f:p=>p.b>0,s:(a,b)=>b.r-a.r,v:p=>p.r+" runs",n:p=>p.r},
{k:"Top Wicket Taker",i:"🎯",d:"Most wickets · ties: better economy",f:p=>p.w>0,s:(a,b)=>b.w-a.w||a.eco-b.eco,v:p=>p.w+" wkts",n:p=>p.w},
{k:"Hard Hitter",i:"💥",d:"Most runs from 4s and 6s",f:p=>p.bnd>0,s:(a,b)=>b.bnd-a.bnd,v:p=>p.bnd+" in boundaries",n:p=>p.bnd},
{k:"All-round Performer",i:"⭐",d:"Bat + bowl · runs + 20 × wickets",f:p=>p.bat&&p.bow&&p.bl>0,s:(a,b)=>(b.r+20*b.w)-(a.r+20*a.w),v:p=>(p.r+20*p.w)+" pts",n:p=>p.r+20*p.w},
{k:"Strike Rotator",i:"🔄",d:"Runs per non-boundary ball · min 10 balls faced",f:p=>p.b>=10,s:(a,b)=>b.rot-a.rot,v:p=>p.rot.toFixed(2)+" /ball",n:p=>p.rot},
{k:"Most Economical Bowler",i:"💎",d:"Lowest economy · min 4 overs",f:p=>p.bl>=24,s:(a,b)=>a.eco-b.eco,v:p=>p.eco.toFixed(2)+" eco",n:p=>20-p.eco},
{k:"Best Fielder",i:"🧤",d:"Catches + stumpings + run-outs",f:p=>p.fd>0,s:(a,b)=>b.fd-a.fd||b.ct-a.ct,v:p=>p.fd+" ("+p.ct+"c"+(p.stp?" "+p.stp+"st":"")+(p.ro?" "+p.ro+"ro":"")+")",n:p=>p.fd}];
CATS.forEach(c=>c.top=L.filter(c.f).sort(c.s));L.forEach(p=>p.badges=CATS.filter(c=>c.top[0]&&c.top[0].name===p.name).map(c=>c.i+" "+c.k));
if(!touched)sel=new Set([...L].sort((a,b)=>b.imp-a.imp).slice(0,15).map(p=>p.name))}
function fillTF(){const ts=[...new Set(ALL.flatMap(m=>m.innings.map(i=>i.team)))],e=$("#tf");if(SEL!==""&&SEL!=="*"&&!ts.includes(SEL))SEL="";e.innerHTML=`<option value="">My Team</option>`+ts.map(t=>`<option>${t}</option>`).join("")+`<option value="*">Everyone</option>`;e.value=SEL}
function setTF(v){SEL=v;try{localStorage.setItem("tt_team",v)}catch(e){}touched=false;cur=null;rebuild()}
function rebuild(){const seen=new Set();ALL=[];[...SEED,...repo,...remote,...local].forEach(m=>{if(!seen.has(m.id)){seen.add(m.id);ALL.push(m)}});compute();
fillTF();$("#kp").innerHTML=`<div><b>${ALL.length}</b>Matches</div><div><b>${L.length}</b>Players</div><div><b>${L.reduce((a,p)=>a+p.r,0)}</b>Runs</div><div><b>${L.reduce((a,p)=>a+p.w,0)}</b>Wickets</div>`;go(tab)}
const stats=p=>`<div class="st"><div><b>${p.r}</b><span>Runs</span></div><div><b>${p.w}</b><span>Wkts</span></div><div><b>${p.b?p.sr.toFixed(0):"–"}</b><span>SR</span></div><div><b>${p.bl?p.eco.toFixed(1):"–"}</b><span>Eco</span></div></div>`;
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e.t);e.t=setTimeout(()=>e.style.display="none",3800)};
const V={
lead:()=>`<div class="g">${CATS.map(c=>{const t=c.top.slice(0,5),f=t[0];return`<div class="c"><div class="ch"><div class="ic">${c.i}</div><div><h3>${c.k}</h3><small>${c.d}</small></div></div>${f?`<div class="top" onclick="show('${f.name}')"><div><small>#1</small><b>${f.name}</b></div><em>${c.v(f)}</em></div>`+t.slice(1).map((p,i)=>`<div class="r" onclick="show('${p.name}')"><span class="n">${i+2}</span><span>${p.name}</span><span class="v">${c.v(p)}</span></div>`).join(""):"<small>No data yet</small>"}</div>`}).join("")}</div>`,
pl:()=>dash(),
sq:()=>{const a=[...L].sort((x,y)=>y.imp-x.imp),rc={};L.filter(p=>sel.has(p.name)).forEach(p=>rc[p.role]=(rc[p.role]||0)+1);
return`<div class="cnt"><span>${sel.size}</span> / 15 picked</div><p style="color:var(--mu);margin:0 0 12px">Ranked by Impact (runs + 25×wkts + 10×dismissals + 0.3×dots − 0.5×extras). Tap to add or remove. Mix: ${Object.entries(rc).map(e=>e[1]+" "+e[0]).join(" · ")||"–"}</p>`+a.map((p,i)=>`<div class="sq ${sel.has(p.name)?"in":""}" onclick="tg('${p.name}')"><div><b>${i+1}. ${p.name}</b><br><small>${p.role} · ${p.r} runs · ${p.w} wkts · Impact ${p.imp.toFixed(0)}</small></div><span class="pill">${sel.has(p.name)?"IN":"OUT"}</span></div>`).join("")},
mt:()=>[...ALL].reverse().map(m=>`<div class="c" style="margin-bottom:12px"><div class="ch"><div class="ic">🏏</div><div><h3>${m.title}</h3><small>${m.date||""} ${m.venue?"· "+m.venue:""}</small></div></div><p style="margin:0 0 6px"><b>${m.result||""}</b></p>${m.innings.map(i=>`<span class="tag b">${i.team} ${i.score}</span>`).join("")}</div>`).join(""),
up:()=>!unlocked?`<div class="c lock"><div style="font-size:42px">🔒</div><h2 style="font-size:30px;margin:4px 0">Captains only</h2><p style="color:var(--mu)">Enter the password to upload match scorecards.</p><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()"><div class="err" id="er"></div><button class="btn" onclick="unlock()">Unlock</button></div>`
:`<div class="c"><div class="ch"><div class="ic">⬆️</div><div><h3>Upload matches</h3><small>Select one or many CricHeroes scorecard PDFs at once</small></div></div>
<label class="drop"><b>Tap to choose files</b>PDF scorecards (or JSON)<input type="file" id="fl" accept=".pdf,.json" multiple hidden onchange="upl(this.files)"></label><div id="log" style="font-size:13px"></div>

let cur=null;const ini=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
function mi(m){const o={};const z=()=>({r:0,b:0,w:0,rc:0,bl:0,dots:0,ex:0,bat:0,bow:0,fd:0});[sides(m)].forEach(i=>{i.bat.forEach(x=>{const p=o[x[0]]||(o[x[0]]=z());p.r+=x[1];p.b+=x[2];p.bat=1});i.bowl.forEach(x=>{const p=o[x[0]]||(o[x[0]]=z());p.w+=x[3];p.rc+=x[2];p.bl+=balls(x[1]);p.dots+=x[4];p.ex+=x[5]+x[6];p.bow=1})});sides(m).field.forEach(st=>fld(st).forEach(q=>{(o[q.n]||(o[q.n]=z())).fd++}));Object.values(o).forEach(p=>p.imp=p.r+25*p.w+.3*p.dots-.5*p.ex+10*p.fd);return o}
function chart(n){const pts=[];ALL.forEach((m,k)=>{const o=mi(m),p=o[n];if(p){const v=Object.values(o);pts.push({k:k+1,p:p.imp,a:v.reduce((x,y)=>x+y.imp,0)/v.length})}});
if(!pts.length)return"<small style='color:var(--mu)'>No match data yet</small>";const mx=Math.max(50,...pts.flatMap(q=>[q.p,q.a]))*1.15,X=i=>pts.length>1?50+i*(340/(pts.length-1)):220,Y=v=>190-Math.max(0,v)/mx*170;
const line=k=>pts.map((q,i)=>X(i)+","+Y(q[k])).join(" ");const gr=[0,.25,.5,.75,1].map(f=>`<line x1="40" x2="410" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--bd)"/><text x="34" y="${Y(mx*f)+4}" text-anchor="end" font-size="10" fill="var(--mu)">${Math.round(mx*f)}</text>`).join("");
return`<svg viewBox="0 0 420 220" style="width:100%">${gr}${pts.length>1?`<polygon points="${X(0)},190 ${line("p")} ${X(pts.length-1)},190" fill="#078bdc" opacity=".18"/>`:""}<polyline points="${line("a")}" fill="none" stroke="#e6b840" stroke-width="2" stroke-dasharray="5 4"/><polyline points="${line("p")}" fill="none" stroke="#078bdc" stroke-width="3"/>${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.a)}" r="3.5" fill="#e6b840"/><circle cx="${X(i)}" cy="${Y(q.p)}" r="5" fill="#078bdc" stroke="#fff" stroke-width="2"/><text x="${X(i)}" y="${Y(q.p)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${q.p.toFixed(0)}</text><text x="${X(i)}" y="210" text-anchor="middle" font-size="10" fill="var(--mu)">Match ${q.k}</text>`).join("")}</svg><div style="font-size:12px;color:var(--mu)"><span style="color:#078bdc">●</span> Player impact &nbsp; <span style="color:#e6b840">●</span> Match average</div>`}
function dash(){if(!L.length)return`<div class="c lock"><div style="font-size:42px">🏏</div><h2 style="font-size:30px;margin:4px 0">No matches yet</h2><p style="color:var(--mu)">Open the Upload tab and add scorecard PDFs to get started.</p></div>`;if(!cur||!P[cur])cur=[...L].sort((a,b)=>b.imp-a.imp)[0].name;const p=P[cur];
const ranks=CATS.map(c=>{const i=c.top.findIndex(x=>x.name===cur);return i<0?"":`<div class="chip"><span>${c.i} ${c.k}</span><b>#${i+1} · ${c.v(p)}</b></div>`}).join("")||"<small style='color:var(--mu)'>Not ranked in any category yet</small>";
const rm=[...ALL].reverse().map(m=>{const q=mi(m)[cur];if(!q)return"";const t=[q.bat?`${q.r} (${q.b})`:"",q.bow?`${q.w}/${q.rc} in ${Math.floor(q.bl/6)}${q.bl%6?"."+q.bl%6:""} ov`:"",q.fd?q.fd+" fielding":""].filter(Boolean).join(" · ");return`<div class="chip"><span>${m.title}<br><small style="color:var(--mu)">${m.date||""}</small></span><b>${t}</b></div>`}).join("")||"<small style='color:var(--mu)'>No matches</small>";
return`<div class="dash"><div><div class="hero"><img src="${LOGO}" alt=""><div><h2>${p.name}</h2><small>${p.role} · Tatva Titans</small><div style="margin-top:8px">${p.badges.map(b=>`<span class="tag b" style="background:#ffffff26;border-color:#fff4">${b}</span>`).join("")}</div></div>
<div class="hs"><div><b>${p.m}</b><span>Matches</span></div><div><b>${p.r}</b><span>Total runs</span></div><div><b>${p.w}</b><span>Wickets</span></div><div><b>${p.hs}</b><span>Highest</span></div><div><b>${p.b?p.sr.toFixed(0):"–"}</b><span>Strike rate</span></div><div><b>${p.bl?p.eco.toFixed(1):"–"}</b><span>Economy</span></div><div><b>${p.fd}</b><span>Dismissals</span></div><div><b>${p.f}/${p.s}</b><span>4s / 6s</span></div><div><b>${p.imp.toFixed(0)}</b><span>Impact</span></div></div></div>
<div class="pn"><div class="pt">Performance rating<small>Impact per match</small></div>${chart(cur)}</div>
<div class="two"><div class="pn"><div class="pt">Category ranks</div>${ranks}</div><div class="pn"><div class="pt">Recent matches</div>${rm}</div></div></div>
<aside class="roster"><div class="pt">Team roster</div><input type="text" id="q" placeholder="Search player…" oninput="flt()"><div id="rl"></div></aside></div>`}
function flt(){const q=($("#q")?.value||"").toLowerCase();const e=$("#rl");if(e)e.innerHTML=[...L].sort((a,b)=>b.imp-a.imp).filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="ro ${p.name===cur?"on":""}" onclick="show('${p.name}')"><div class="av">${ini(p.name)}</div><div><b>${p.name}</b><small>${p.role} · Impact ${p.imp.toFixed(0)}</small></div></div>`).join("")}
function show(n){cur=n;go("pl");window.scrollTo(0,0)}
function tg(n){touched=true;if(sel.has(n))sel.delete(n);else if(sel.size<15)sel.add(n);else{toast("You already have 15. Remove one first.");return}go("sq")}
function go(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("#main").innerHTML=V[t]();$("#ttl").textContent={lead:"Leaderboards",pl:"Player Dashboard",sq:"Pick your 15",mt:"Matches",up:"Upload scorecards"}[t];if(t==="pl")flt()}
async function unlock(){const v=$("#pw").value;const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))].map(b=>b.toString(16).padStart(2,"0")).join("");
if(h===HASH){unlocked=true;try{sessionStorage.setItem("tt_ok","1")}catch(e){}go("up")}else{$("#er").textContent="Wrong password";$("#pw").value=""}}
// ---- upload & parsing ----
async function pdfLines(file){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const d=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
for(let n=1;n<=d.numPages;n++){const c=await(await d.getPage(n)).getTextContent(),rows=[];
c.items.filter(i=>i.str.trim()).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).forEach(i=>{const y=i.transform[5],r=rows.find(r=>Math.abs(r.y-y)<3);r?r.t.push(i):rows.push({y,t:[i]})});
rows.forEach(r=>out.push(r.t.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join(" ").replace(/†/g,"").replace(/\s+/g," ").trim()))}return out}
function parseLines(lines){const txt=lines.join(" ");const inn=[];let cur=null;
const H=/^(.+?)\s+(\d+\/\d+)\s+\(([\d.]+)\s*Ov\)\s*\(\d+\w*\s*Innings\)/,B=/^\d+\s+(.+?)\s*(?:\([^)]*\)\s*)*\((?:RHB|LHB)\)\s+(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+(?:\.\d+)?)$/,W=/^\d+\s+(.+?)\s+(\d+(?:\.\d)?)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+(?:\.\d+)?)$/;
lines.forEach(l=>{let m;if(m=l.match(H)){cur={team:m[1].trim(),score:`${m[2]} (${m[3]})`,bat:[],bowl:[]};inn.push(cur)}else if(cur&&(m=l.match(B))){const st=m[2];cur.bat.push([m[1].trim(),+m[3],+m[4],+m[6],+m[7],/not out|retired/i.test(st)?0:1,st.trim()])}
else if(cur&&(m=l.match(W))){cur.bowl.push([m[1].replace(/\s*\([^)]*\)/g,"").trim(),m[2],+m[4],+m[5],+m[6],+m[9],+m[10]])}});
if(!inn.length||!inn.some(i=>i.bat.length))throw new Error("no scorecard rows found");
const sh=t=>t.replace(/^Tatva\s+/i,"");const d=txt.match(/Date\s+(\d{4})-(\d{2})-(\d{2})/),ri=txt.lastIndexOf("Result "),rt=ri<0?"":txt.slice(ri+7),r=rt.match(/^(.*?won by \d+ \w+)/i)||rt.match(/^(.*?(?:tied|no result|abandoned))/i);
const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const m={title:inn.map(i=>sh(i.team)).join(" vs "),date:d?`${+d[3]} ${mo[+d[2]-1]} ${d[1]}`:"",venue:"",result:r?sh(r[1]):"",innings:inn.map(i=>({...i,team:sh(i.team)}))};
m.id="m"+[...(d?d[0]:"")+inn.map(i=>i.team+i.score).join("|")].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);return m}
async function save(m){if(ALL.some(x=>x.id===m.id))return"dup";
if(db){try{await db.collection("matches").doc(m.id).set({json:JSON.stringify(m)});return"shared"}catch(e){}}
local.push(m);try{localStorage.setItem("tt_local",JSON.stringify(local))}catch(e){}rebuild();return"device"}
async function upl(files){const log=$("#log");log.innerHTML="";let add=0;
for(const f of files){const row=document.createElement("div");row.textContent="⏳ "+f.name;log.append(row);
try{let ms;if(/\.json$/i.test(f.name)){const j=JSON.parse(await f.text());ms=Array.isArray(j)?j:[j];ms.forEach(m=>{m.id=m.id||"m"+Date.now()+Math.random().toString(36).slice(2,6)})}else ms=[parseLines(await pdfLines(f))];
for(const m of ms){const s=await save(m);row.textContent=s==="dup"?`↩︎ ${f.name}: already added`:`✅ ${f.name}: ${m.title} (${s==="shared"?"shared with everyone":"saved on this device only"})`;if(s!=="dup")add++}}
catch(e){row.textContent=`❌ ${f.name}: couldn’t read this file (${e.message})`}}
if(add)toast(add+" match"+(add>1?"es":"")+" added")}
async function del(id){if(!confirm("Delete this match?"))return;try{if(db&&remote.some(m=>m.id===id))await db.collection("matches").doc(id).delete()}catch(e){}
local=local.filter(m=>m.id!==id);try{localStorage.setItem("tt_local",JSON.stringify(local))}catch(e){}remote=remote.filter(m=>m.id!==id);repo=repo.filter(m=>m.id!==id);rebuild()}
function dl(){const b=new Blob([JSON.stringify(ALL.filter(m=>m.id!=="seed1"),null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="matches.json";a.click()}
const dlg=$("#dlg");dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));$("#yr").textContent=new Date().getFullYear();rebuild();
try{fetch("matches.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(j=>{if(Array.isArray(j)&&j.length){repo=j;rebuild()}}).catch(()=>{})}catch(e){}

try{window.claude&&claude.use("db").then(d=>{if(!d)return;db=d;let t=setTimeout(()=>{},0);d.collection("matches").onSnapshot(s=>{remote=s.docs.map(x=>{try{return JSON.parse(x.data().json)}catch(e){return null}}).filter(Boolean);rebuild()},()=>{})}).catch(()=>{})}catch(e){}
</script></body></html>
